spring.application.name=viajes-service
server.port=${SERVER_PORT:8083}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.probes.enabled=true
server.error.include-message=always
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/viajes;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:taxi}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:taxi_local}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.cloud.openfeign.client.config.default.connectTimeout=1500
spring.cloud.openfeign.client.config.default.readTimeout=2000
spring.cloud.openfeign.circuitbreaker.enabled=false
resilience4j.circuitbreaker.configs.default.sliding-window-size=4
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.ignore-exceptions=org.citcuit.domain.ClienteInexistente,org.citcuit.domain.SinTaxi
resilience4j.circuitbreaker.instances.clientes.base-config=default
resilience4j.circuitbreaker.instances.taxis.base-config=default
